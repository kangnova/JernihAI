# Override untuk full-stack E2E pada SATU instance Vast.ai (Opsi B).
# Memberi worker-gpu bind mount ./api:/app agar berbagi storage
# (uploads/results/weights) dengan service api — lihat docs/DEPLOY_VAST.md.
#
#   docker compose -f docker-compose.yml -f infra/vast/compose.vast.yml \
#     --profile gpu up -d --build
#
# Catatan: compose me-resolve path relatif override terhadap file compose
# PERTAMA (docker-compose.yml di root repo), jadi `./api` = <root>/api.
services:
  worker-gpu:
    volumes:
      - ./api:/app

  # FR-07: Celery Beat — sweep retensi data (original 24 jam, hasil 7 hari).
  # Wajib ikut berjalan agar auto-delete aktif di produksi Vast.ai.
  beat:
    build: ./api
    command: celery -A app.tasks.worker.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jernihai}:${POSTGRES_PASSWORD:-jernihai}@db:5432/${POSTGRES_DB:-jernihai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
