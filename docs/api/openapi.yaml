          description: Key asli (`jn_...`) — TAMPILKAN SEKALI dan simpan; tidak akan
            pernah muncul lagi.
      type: object
      required:
      - key
      - full_key
      title: ApiKeyCreated
      description: Respons pembuatan key — memuat key asli SEKALI SAJA.
    ApiKeyList:
      properties:
