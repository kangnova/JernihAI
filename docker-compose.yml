name: jernihai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jernihai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jernihai}
      POSTGRES_DB: ${POSTGRES_DB:-jernihai}
    ports:
      # Host port bisa di-override bila 5432 terpakai: POSTGRES_PORT=5434
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jernihai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    # ADR-011: migrasi skema (Alembic) dijalankan OTOMATIS sebelum api start —
    # deploy ke VPS tidak perlu `docker compose down -v` saat kolom baru.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jernihai}:${POSTGRES_PASSWORD:-jernihai}@db:5432/${POSTGRES_DB:-jernihai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: '["http://localhost:3000"]'
      JWT_SECRET: ${JWT_SECRET:-dev-secret-ganti-di-produksi-0123456789abcdef}
      WEB_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      # FR-13: email admin (list JSON) — contoh: '["admin@example.com"]'
      ADMIN_EMAILS: ${ADMIN_EMAILS:-[]}
      # FR-11: Midtrans Snap — kosongkan untuk mode MOCK (dev).
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./api
    command: celery -A app.tasks.worker.celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jernihai}:${POSTGRES_PASSWORD:-jernihai}@db:5432/${POSTGRES_DB:-jernihai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat — scheduler tugas berkala (FR-07 retensi data).
  # Jalankan bersama worker agar file kedaluwarsa otomatis dihapus:
  #   docker compose up -d worker beat
  beat:
    build: ./api
    command: celery -A app.tasks.worker.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jernihai}:${POSTGRES_PASSWORD:-jernihai}@db:5432/${POSTGRES_DB:-jernihai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker GPU produksi (Real-ESRGAN asli, PyTorch CUDA — ADR-001/002).
  # Aktifkan saat deploy di GPU cloud (Vast.ai):
  #   docker compose --profile gpu up -d --build worker-gpu
  # Catatan: storage (uploads/results) & weights dibake ke image; untuk
  # multi-node, pasang volume bersama atau Cloudflare R2 (prd.md §9).
  worker-gpu:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    profiles: ["gpu"]
    command: celery -A app.tasks.worker.celery_app worker --loglevel=info --pool=solo
    environment:
      ENVIRONMENT: production
      ENHANCE_BACKEND: real
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jernihai}:${POSTGRES_PASSWORD:-jernihai}@db:5432/${POSTGRES_DB:-jernihai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # FR-11: true hanya saat pakai akun Midtrans PRODUKSI (URL script Snap
      # berbeda: app.midtrans.com vs app.sandbox.midtrans.com).
      NEXT_PUBLIC_MIDTRANS_PRODUCTION: ${NEXT_PUBLIC_MIDTRANS_PRODUCTION:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  # Reverse proxy sesuai arsitektur PRD §9 — aktifkan bila diperlukan:
  #   docker compose --profile gateway up
  gateway:
    image: nginx:1.27-alpine
    profiles: ["gateway"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  web_node_modules:
