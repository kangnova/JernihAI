# Konfigurasi Alembic (ADR-011) - migrasi skema DB.
#
# PENTING (Windows): file ini dibaca configparser dengan encoding lokal
# (cp1252) - JANGAN tambahkan karakter non-ASCII (mis. em-dash, panah)
# di sini atau `alembic` akan gagal decode. Gunakan ASCII murni.
#
# `sqlalchemy.url` sengaja KOSONG: env.py memakai URL dari konfigurasi
# aplikasi (`settings.database_url` <- env `DATABASE_URL`) agar satu sumber
# kebenaran (sama dengan engine runtime di app/db/session.py). Test bisa
# meng-override via set_main_option.
[alembic]
script_location = migrations
prepend_sys_path = .
# Mencegah DeprecationWarning pada alembic >= 1.12 (Windows/Linux).
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
