            $ref: '#/components/schemas/ApiKeyOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: ApiKeyList
    ApiKeyOut:
      properties:
        id:
          type: string
          title: Id
          description: ID key (dipakai untuk mencabut key).
        name:
          type: string
          title: Name
          description: Label bebas dari developer.
        key_prefix:
          type: string
          title: Key Prefix
          description: Awalan pendek key untuk tampilan, mis. `jn_AbC123xYz`.
        tier:
          type: string
          title: Tier
          description: 'Tier key: `free` (20 req/menit) atau `pro` (120 req/menit).'
        is_active:
          type: boolean
          title: Is Active
          description: '`false` setelah key dicabut.'
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: Waktu key dibuat.
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: Terakhir kali key dipakai (audit).
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
          description: Waktu pencabutan key (None = aktif).
