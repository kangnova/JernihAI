openapi: 3.1.0
info:
  title: JernihAI API
  description: 'API backend JernihAI — platform peningkatan kualitas gambar.


    Dokumentasi API Publik B2B (FR-14) untuk developer: `docs/API_B2B.md`. Spesifikasi
    OpenAPI lengkap: `docs/api/openapi.yaml` (regenerate via `python api/scripts/export_openapi.py`).'
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Liveness check
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Readiness check
      operationId: ready_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Daftar akun baru
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login email + password
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Keluar (hapus cookie sesi)
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Logout Api V1 Auth Logout Post
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Profil user yang login
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
  /api/v1/auth/consent:
    post:
      tags:
      - auth
      summary: Setujui kebijakan privasi (FR-07)
      description: 'Catat persetujuan privasi — dipakai user Google OAuth yang daftar

        tanpa form (consent diminta lewat banner di dashboard). Idempoten.'
      operationId: grant_privacy_consent_api_v1_auth_consent_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
  /api/v1/auth/google:
    get:
      tags:
      - auth
      summary: Mulai login Google (redirect ke Google)
      operationId: google_login_api_v1_auth_google_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Google Login Api V1 Auth Google Get
  /api/v1/auth/google/callback:
    get:
      tags:
      - auth
      summary: Callback Google — tukar code dengan token lalu set cookie
      operationId: google_callback_api_v1_auth_google_callback_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/billing/packages:
    get:
      tags:
      - billing
      summary: Paket kredit + saldo (FR-11)
      operationId: get_packages_api_v1_billing_packages_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagesOut'
  /api/v1/billing/checkout:
    post:
      tags:
      - billing
      summary: Buat order + token Snap (FR-11)
      operationId: checkout_api_v1_billing_checkout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/billing/transactions:
    get:
      tags:
      - billing
      summary: Riwayat transaksi user (FR-11)
      operationId: list_transactions_api_v1_billing_transactions_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/billing/webhook:
    post:
      tags:
      - billing
      summary: Notifikasi pembayaran Midtrans (FR-11)
      description: 'Terima notifikasi Midtrans, verifikasi signature, cairkan kredit.


        Idempoten: order yang sudah `paid` tidak diproses ulang (webhook

        duplikat/tunda tidak menggandakan saldo). Balas selalu 200 untuk

        event yang sah (Midtrans mengulang pengiriman bila bukan 2xx).'
      operationId: midtrans_webhook_api_v1_billing_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Midtrans Webhook Api V1 Billing Webhook Post
  /api/v1/jobs:
    post:
      tags:
      - jobs
      summary: Upload gambar & mulai proses (FR-02/FR-03)
      operationId: create_job_api_v1_jobs_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_job_api_v1_jobs_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - jobs
      summary: Riwayat job user (FR-10)
      description: 'Daftar job milik user, terbaru dulu (FR-10).


        Hanya job milik user yang login — tidak membocorkan job orang lain.

        Pagination `limit`/`offset`; `result_deleted_at` memberitahu UI bahwa

        hasil sudah dihapus retensi (tombol unduh ulang dinonaktifkan).'
      operationId: list_jobs_api_v1_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/batch:
    post:
      tags:
      - jobs
      summary: Upload beberapa gambar sekaligus (FR-12)
      description: 'Buat hingga `batch_max_files` job dalam satu request (FR-12).


        Validasi SEMUA file dulu (sebelum simpan apa pun) agar request gagal

        atomik: satu file tidak valid -> tidak ada job yang dibuat, kuota

        tidak terpotong. Kuota dicek untuk total batch (FR-06).'
      operationId: create_batch_jobs_api_v1_jobs_batch_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_batch_jobs_api_v1_jobs_batch_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Cek status job (polling — FR-03)
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/download:
    get:
      tags:
      - jobs
      summary: Unduh hasil proses (FR-05)
      operationId: download_result_api_v1_jobs__job_id__download_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/quota:
    get:
      tags:
      - quota
      summary: Sisa kuota gratis hari ini (FR-06)
      operationId: get_quota_api_v1_quota_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaOut'
  /api/v1/account/export:
    get:
      tags:
      - account
      summary: Ekspor data pribadi (hak akses — NFR-05)
      description: 'Salinan JSON data pribadi user: profil + meta riwayat job.


        Sesuai UU PDP, hasil export TIDAK memuat konten biner gambar — cukup

        metadata; file asli/olah tunduk retensi otomatis (FR-07).'
      operationId: export_data_api_v1_account_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/account:
    delete:
      tags:
      - account
      summary: Hapus akun & seluruh data (hak hapus — NFR-05)
      description: 'Hapus akun beserta SEMUA data: job rows, file original & hasil
        di

        disk, lalu user. Cookie sesi dibersihkan (log out).


        Idempoten: bila user tidak lagi ada, `get_current_user` sudah menolak

        (401) — tidak ada partial state.'
      operationId: delete_account_api_v1_account_delete
      responses:
        '204':
          description: Successful Response
  /api/v1/admin/stats:
    get:
      tags:
      - admin
      summary: Statistik platform (FR-13)
      operationId: admin_stats_api_v1_admin_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
  /api/v1/admin/jobs:
    get:
      tags:
      - admin
      summary: Semua job lintas user (FR-13)
      description: 'Daftar job (terbaru dulu) — semua user atau riwayat SATU user
        (`email`).


        `email` = pencocokan persis (email unik) — dipakai admin melihat

        riwayat lengkap milik user tertentu.'
      operationId: admin_jobs_api_v1_admin_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users:
    get:
      tags:
      - admin
      summary: Daftar user + kuota & kredit (FR-13)
      description: 'Direktori user: email, nama, provider, kuota gratis (FR-06), saldo

        kredit (FR-11), consent privasi (FR-07), dan jumlah riwayat job.


        `email` = pencarian parsial (ilike); urut terbaru dulu.'
      operationId: admin_users_api_v1_admin_users_get
      parameters:
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Email
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}:
    get:
      tags:
      - admin
      summary: Detail satu user (profil + kuota/kredit) — FR-13
      description: 'Profil lengkap satu user — dipakai halaman detail admin

        (email, kuota, kredit, consent, jumlah riwayat job).'
      operationId: admin_user_detail_api_v1_admin_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - admin
      summary: Aktif / nonaktifkan akun user (alat admin)
      description: 'Toggle `is_active` user (suspend). Sesi user langsung ditolak
        oleh

        `get_current_user`; login berikutnya juga ditolak. Admin tidak bisa

        menonaktifkan akun sendiri (mengunci diri).'
      operationId: admin_user_update_api_v1_admin_users__user_id__patch
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}/transactions:
    get:
      tags:
      - admin
      summary: Transaksi kredit satu user — FR-13
      description: 'Riwayat pembelian kredit (FR-11) milik satu user — terbaru dulu.

        Dipakai halaman detail admin untuk audit transaksi.'
      operationId: admin_user_transactions_api_v1_admin_users__user_id__transactions_get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTransactionList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/quota/reset:
    post:
      tags:
      - admin
      summary: Reset kuota gratis user (alat admin)
      description: 'Reset pemakaian kuota gratis (FR-06) untuk satu user atau semua.


        Alat untuk pengelola/pengembang saat uji coba: set `used=0` dan tanggal

        reset ke hari ini (WIB) — tanpa mengubah limit dari env.'
      operationId: admin_quota_reset_api_v1_admin_quota_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaResetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaResetOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/jobs/{job_id}:
    delete:
      tags:
      - admin
      summary: Hapus job + file-nya (alat admin)
      description: 'Hapus permanen job (baris DB + file original & hasil di disk).


        File hanya dihapus bila berada di dalam upload_dir/result_dir (guard

        path traversal via `delete_if_inside`). Dipakai pengelola membersihkan

        data uji coba.'
      operationId: admin_delete_job_api_v1_admin_jobs__job_id__delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Admin Delete Job Api V1 Admin Jobs  Job Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/export/users.csv:
    get:
      tags:
      - admin
      summary: 'Ekspor CSV: seluruh user + kuota/kredit (audit — FR-13)'
      description: 'CSV untuk audit: email, kuota, kredit, consent, jumlah riwayat.

        `email` = filter parsial (sama dengan direktori user).'
      operationId: admin_export_users_csv_api_v1_admin_export_users_csv_get
      parameters:
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/export/jobs.csv:
    get:
      tags:
      - admin
      summary: 'Ekspor CSV: seluruh job + email pemilik (audit — FR-13)'
      description: CSV riwayat job lintas user (atau satu user via `email` persis).
      operationId: admin_export_jobs_csv_api_v1_admin_export_jobs_csv_get
      parameters:
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/export/transactions.csv:
    get:
      tags:
      - admin
      summary: 'Ekspor CSV: seluruh transaksi kredit + email user (audit — FR-13)'
      description: CSV transaksi pembelian kredit (FR-11) — terbaru dulu.
      operationId: admin_export_transactions_csv_api_v1_admin_export_transactions_csv_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/admin/users/{user_id}/jobs:
    delete:
      tags:
      - admin
      summary: Hapus SEMUA job user + file-nya (alat admin)
      description: 'Hapus permanen SEMUA job milik satu user (baris DB + file di disk).


        Dipakai halaman detail admin untuk membersihkan data uji coba satu

        user sekaligus — job milik user lain tidak tersentuh.'
      operationId: admin_delete_user_jobs_api_v1_admin_users__user_id__jobs_delete
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Admin Delete User Jobs Api V1 Admin Users  User Id  Jobs
                  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/b2b/jobs:
    post:
      tags:
      - b2b
      summary: 'B2B: upload gambar & mulai proses (FR-14)'
      description: 'Pay-per-call: 1 job = 1 kredit dari saldo pemilik key.


        Potongan kredit bersifat **atomik** (2 request bersamaan tidak bisa

        memakai saldo yang sama). Tanpa saldo -> 402 Payment Required.

        Status awal `queued` — job diproses worker asinkron; polling dengan

        `GET /b2b/jobs/{id}` hingga `completed`.'
      operationId: b2b_create_job_api_v1_b2b_jobs_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_b2b_create_job_api_v1_b2b_jobs_post'
        required: true
      responses:
        '201':
          description: Job dibuat (status awal `queued`) dan 1 kredit terpotong dari
            saldo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '400':
          description: '`scale`/`output_format` tidak dikenal, atau PNG melebihi batas
            4096 px sisi terpanjang (ADR-004)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: scale harus salah satu dari [2, 4]
        '402':
          description: Saldo kredit kosong — isi lewat halaman Billing web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Saldo kredit kosong (B2B: 1 gambar = 1 kredit). Isi saldo
                  via halaman Billing web.'
        '413':
          description: File melebihi batas ukuran (10 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Ukuran maksimal 10 MB
        '415':
          description: Format file tidak didukung — hanya JPG/PNG/WebP (dicek konten)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Hanya menerima JPG, PNG, atau WebP (validasi konten, bukan
                  ekstensi)
        '422':
          description: Validasi form gagal (mis. `scale` bukan int, `file` kosong)
            — `detail` berupa LIST error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - loc:
                  - body
                  - name
                  msg: Field required
                  type: value_error
        '401':
          description: Header `X-API-Key` tidak ada atau key tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Header X-API-Key wajib diisi (lihat /api-keys)
        '403':
          description: Key dinonaktifkan (dicabut) atau akun pemilik di-suspend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: API key dinonaktifkan (dicabut oleh pemilik)
        '429':
          description: Rate limit per menit tier terlampaui (free 20 / pro 120)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Terlalu banyak permintaan — coba lagi beberapa saat lagi.
  /api/v1/b2b/jobs/{job_id}:
