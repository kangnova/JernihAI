  /api/v1/b2b/keys:
    get:
      tags:
      - b2b
      summary: Daftar API key saya (FR-14)
      operationId: list_api_keys_api_v1_b2b_keys_get
      responses:
        '200':
          description: Daftar key milik user yang login (tanpa key asli).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '401':
          description: Belum login (butuh sesi cookie web)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Belum login
    post:
      tags:
      - b2b
      summary: Buat API key baru (FR-14)
      operationId: create_api_key_api_v1_b2b_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
        required: true
      responses:
        '201':
          description: Key baru dibuat — `full_key` tampil SEKALI (hanya hash SHA-256
            tersimpan).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          description: Tier tidak dikenal (harus `free` atau `pro`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: tier harus salah satu dari ['free', 'pro']
        '422':
          description: Validasi nama gagal — `detail` berupa LIST error; nama yang
            hanya spasi menjawab 422 dengan `detail` string 'Nama key wajib diisi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - loc:
                  - body
                  - name
                  msg: String should have at least 1 character
                  type: value_error
        '401':
          description: Belum login (butuh sesi cookie web)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Belum login
  /api/v1/b2b/keys/{key_id}:
    delete:
      tags:
      - b2b
      summary: Cabut (revoke) API key (FR-14)
      operationId: revoke_api_key_api_v1_b2b_keys__key_id__delete
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '204':
          description: Key dinonaktifkan — semua permintaan dengannya ditolak 403.
        '404':
          description: Key tidak ditemukan (atau milik user lain)
          content:
            application/json:
              example:
                detail: API key tidak ditemukan
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Belum login (butuh sesi cookie web)
          content:
            application/json:
              example:
                detail: Belum login
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
