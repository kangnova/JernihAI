# Reverse proxy JernihAI (PRD §9: API Gateway)
# Dipasang sebagai /etc/nginx/conf.d/default.conf di service `gateway`
# (profile compose "gateway").

upstream jernihai_api {
    server api:8000;
}

upstream jernihai_web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;  # PRD FR-02: maks upload 10 MB + margin

    location /api/ {
        proxy_pass http://jernihai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://jernihai_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
