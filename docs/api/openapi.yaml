          default: free
      type: object
      required:
      - name
      title: ApiKeyCreateRequest
      description: Buat key baru; `tier` menentukan rate limit per menit.
      examples:
      - name: Produksi
        tier: pro
    ApiKeyCreated:
      properties:
        key:
          $ref: '#/components/schemas/ApiKeyOut'
          description: Metadata key (tanpa key asli).
