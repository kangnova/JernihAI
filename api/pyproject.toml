[project]
name = "jernihai-api"
version = "0.1.0"
description = "JernihAI — Backend API (FastAPI) untuk platform peningkatan kualitas gambar"
# >=3.11 (bukan >=3.12): base image worker GPU pytorch/pytorch:2.5.1
# resmi membawa Python 3.11 (conda); basicsr 1.4.2 (2023) tidak kompatibel
# dgn Python 3.12 (distutils dihapus). API CPU tetap jalan di 3.12.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "aiosqlite>=0.20.0",
]

# Backend inference ML (Fase 2 — ADR-002). DIPASANG HANYA di image worker
# GPU (Dockerfile.worker): torch/torchvision sudah tersedia dari base image
# pytorch/pytorch, jangan instal ulang dari PyPI. numpy<2 wajib karena
# BasicSR/Real-ESRGAN belum kompatibel dengan numpy 2.x.
# Versi di-pin (bukan >=) agar image worker reprodusibel; numpy<2 wajib
# karena BasicSR/Real-ESRGAN belum kompatibel dengan numpy 2.x.
# opencv-python (BUKAN -headless): basicsr/realesrgan/gfpgan semuanya
# me-declare opencv-python sebagai dependency; memaksa headless berujung
# konflik file saat pip install. libgl1/libglib2.0-0 di Dockerfile.worker
# sudah meng-cover kebutuhan runtime opencv-python non-headless.
gpu = [
    "numpy>=1.26,<2",
    "basicsr==1.4.2",
    "realesrgan==0.3.0",
    "facexlib==0.3.0",
    "gfpgan==1.3.8",
    "opencv-python==4.9.0.80",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: pemanggilan fungsi di default arg (pola umum FastAPI: Depends(...))
ignore = ["B008"]
