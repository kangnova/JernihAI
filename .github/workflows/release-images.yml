# Build & push image produksi (api, web, worker-gpu) ke Docker Hub otomatis
# saat tag rilis dibuat:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Image yang dihasilkan (tag selalu eksplisit, tanpa `latest` — konvensi
# runbook docs/DEPLOY_VAST.md):
#   <USER>/jernihai-api:v0.1.0      — API FastAPI + worker CPU (mock backend)
#   <USER>/jernihai-web:v0.1.0      — frontend Next.js standalone
#   <USER>/jernihai-worker:v0.1.0   — worker GPU Real-ESRGAN (deploy Vast.ai)
#
# Secrets yang wajib di-set di repo Settings -> Secrets and variables ->
# Actions:
#   DOCKERHUB_USERNAME  — username akun Docker Hub
#   DOCKERHUB_TOKEN     — access token (bukan password), dari hub.docker.com
#
# Variabel repo (opsional) — Settings -> Variables:
#   NEXT_PUBLIC_API_URL — URL API produksi, di-bake ke image web saat build
#                         (default http://localhost:8000 — ganti ke URL
#                         produksi, mis. https://api.jernihai.id)

name: Release images (api, web, worker)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NS: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # Gate: tag rilis hanya boleh membangun image bila lint + test lulus
  # (API + Web, sama seperti ci.yml).
  test:
    name: Gate — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API — install deps
        run: pip install -e ".[dev]"
        working-directory: api
      - name: API — lint (ruff)
        run: ruff check .
        working-directory: api
      - name: API — test (pytest)
        run: pytest -q
        working-directory: api

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web — install deps
        run: npm ci
        working-directory: web
      - name: Web — lint (eslint)
        run: npm run lint
        working-directory: web
      - name: Web — typecheck (tsc)
        run: npx tsc --noEmit
        working-directory: web

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    # Image worker ~8 GB (pull base pytorch + kompilasi basicsr); gagal
    # cepat bila build menggantung, bukan menunggu timeout default 6 jam.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            dockerfile: ./api/Dockerfile
            build_args: ""
          - image: web
            context: ./web
            dockerfile: ./web/Dockerfile
            # URL API produksi dari variabel repo; fallback default dev.
            build_args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          - image: worker
            context: ./api
            dockerfile: ./api/Dockerfile.worker
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NS }}/jernihai-${{ matrix.image }}
          tags: |
            # Tag rilis vX.Y.Z -> jernihai-<image>:vX.Y.Z
            type=ref,event=tag
            # Jalur manual (workflow_dispatch) -> jernihai-<image>:manual-<sha>
            # `enable` mencegah tag manual-<sha> ikut terbit saat push tag rilis
            type=sha,prefix=manual-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.build_args }}
          # Cache lintas build disimpan di registry Docker Hub (bukan GHA
          # ephemeral): rebuild cepat + layer base ter-dedupe.
          cache-from: type=registry,ref=${{ env.IMAGE_NS }}/jernihai-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NS }}/jernihai-${{ matrix.image }}:buildcache,mode=max
