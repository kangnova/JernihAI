      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: 'Gambar input: JPG/PNG/WebP, maks 10 MB (validasi magic bytes,
            bukan ekstensi).'
        scale:
          type: integer
          title: Scale
          description: Faktor pembesaran (2x atau 4x).
          default: 2
          examples:
          - 2
          - 4
        output_format:
          type: string
          title: Output Format
          description: 'Format hasil: `webp` (default, terbaik), `jpeg`, atau `png`
            (lossless — dibatasi ≤ 4096 px sisi terpanjang, ADR-004).'
          default: webp
          examples:
          - webp
          - jpeg
          - png
        face_enhance:
          type: boolean
          title: Face Enhance
          description: Restorasi wajah (GFPGAN) — memperjelas wajah pada foto lama.
          default: false
        denoise:
          type: boolean
          title: Denoise
          description: Kurangi noise/grain pada foto lama.
          default: false
        color_enhance:
          type: boolean
          title: Color Enhance
          description: Pertegas warna (saturasi/kontras) untuk foto pudar.
          default: false
      type: object
      required:
      - file
      title: Body_b2b_create_job_api_v1_b2b_jobs_post
