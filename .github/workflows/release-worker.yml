# Build & push image worker GPU (Real-ESRGAN / PyTorch CUDA) ke Docker Hub
# otomatis saat tag rilis dibuat:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Image yang dihasilkan: <USER>/jernihai-worker:v0.1.0 — dipakai deploy
# Vast.ai (docs/DEPLOY_VAST.md §A2). Tag selalu eksplisit, tanpa `latest`
# (konvensi runbook: deploy reproduktif).
#
# Secrets yang wajib di-set di repo Settings -> Secrets and variables ->
# Actions:
#   DOCKERHUB_USERNAME  — username akun Docker Hub
#   DOCKERHUB_TOKEN     — access token (bukan password), dari hub.docker.com
#
# Bisa juga dijalankan manual: Actions -> "Release worker-gpu image" ->
# Run workflow (tag image `manual-<sha>`).

name: Release worker-gpu image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-worker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/jernihai-worker

jobs:
  # Gate: tag rilis hanya boleh membangun image bila lint + test API lulus.
  test:
    name: Gate — lint & test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q

  build-and-push:
    name: Build & push image ke Docker Hub
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag rilis vX.Y.Z -> jernihai-worker:vX.Y.Z
            type=ref,event=tag
            # Jalur manual (workflow_dispatch) -> jernihai-worker:manual-<sha>
            # `enable` mencegah tag manual-<sha> ikut terbit saat push tag rilis
            type=sha,prefix=manual-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Cache lintas build disimpan di registry Docker Hub (bukan GHA
          # ephemeral): rebuild cepat + basis pytorch ~8 GB ter-dedupe.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
